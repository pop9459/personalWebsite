# Mounted into the stock php:8.2-apache image as /etc/apache2/conf-enabled/site.conf
# (see docker-compose.yaml). Keep this file outside the document root.

# Real visitor IP. The site is behind Cloudflare, which sends the visitor address in
# CF-Connecting-IP. The header is only trusted when the request comes from a Cloudflare
# edge address, so direct-to-origin scanners cannot spoof it and keep their own IP.
# Ranges: https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6
LoadModule remoteip_module /usr/lib/apache2/modules/mod_remoteip.so
RemoteIPHeader CF-Connecting-IP
RemoteIPTrustedProxy 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22
RemoteIPTrustedProxy 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20
RemoteIPTrustedProxy 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13
RemoteIPTrustedProxy 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22
RemoteIPTrustedProxy 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32
RemoteIPTrustedProxy 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32

# Apache "combined" plus bytes received (%I), bytes sent (%O), response time in
# microseconds (%D) and the raw connection address (%{c}a). %a is the visitor IP after
# mod_remoteip; %{c}a is the address that actually connected (a Cloudflare edge address
# for proxied requests), so the analysis can still tell proxied from direct traffic.
# mod_logio (%I %O) is already compiled into the php:8.2-apache image.
LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %I %O %D %{c}a" extended

# Defence in depth: the document root is public/, which contains no repo files, but
# never serve dotfiles or deployment files if one ever ends up there.
<DirectoryMatch "/\.(git|svn|hg)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
<FilesMatch "^(docker-compose.*|Dockerfile|README.*)$">
    Require all denied
</FilesMatch>
