# Replaces the stock default vhost so the access log uses the "extended" format from
# site.conf. With /var/log/apache2 mounted from the host (docker-compose.yaml) both logs
# are real files that survive container recreation; they are rotated on the host.
<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log extended
</VirtualHost>
