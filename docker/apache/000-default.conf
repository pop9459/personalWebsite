# Replaces the stock default vhost so the access log uses the "extended" format from
# site.conf. With /var/log/apache2 mounted from the host (docker-compose.yaml) both logs
# are real files that survive container recreation; they are rotated on the host.
LoadModule rewrite_module /usr/lib/apache2/modules/mod_rewrite.so

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log extended

    # Section URLs (KAP-112): each menu section has its own path that serves index.php, so
    # the access log can count visits per section. The list must match public/scripts/sections.js.
    # Unknown paths still 404. The browser URL is unchanged (internal rewrite).
    RewriteEngine On
    RewriteRule ^/(about|projects/personal-website|projects/maturity-project|projects/sunny-socks-website|projects/campus-link|projects/battlebot|portfolio2/reflection|portfolio2/feedback|portfolio2/pdp|portfolio2/project-plan|portfolio2/communication|portfolio2/presenting|portfolio2/edumundo-assignments|portfolio2/meeting-techniques|portfolio2/final-interview|portfolio1/reflection-report|portfolio1/study-career-coaching|portfolio1/feedback-forms|portfolio1/project-plan|portfolio1/communication|portfolio1/presentation|portfolio1/meeting-techniques|portfolio1/edumundo-assignments)/?$ /index.php [L]
</VirtualHost>
