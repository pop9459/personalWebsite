services:
  web:
    image: php:8.2-apache
    ports:
      - "80:80"
    volumes:
      # Only the site is served; repo files (.git, compose file, webhook/) stay outside.
      - ./public:/var/www/html
      - ./docker/apache/site.conf:/etc/apache2/conf-enabled/site.conf:ro
      - ./docker/apache/000-default.conf:/etc/apache2/sites-available/000-default.conf:ro
      # Persistent access/error logs (rotated by logrotate on the host).
      - /var/log/website:/var/log/apache2
    # Apache writes to the mounted files above; this only caps what still goes to docker.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped

  webhook:
    build:
      context: ./webhook
    ports:
      - "5000:5000"
    volumes:
      - .:/repo
    environment:
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
